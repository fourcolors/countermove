<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Acme Stay</title>
</head>
<body>
  <header>
    <h1>Acme Stay</h1>
    <p>Software for independent vacation-rental hosts.</p>
  </header>
  <main>
    <article data-plan="pro">
      <h2>Pro</h2>
      <p class="price">$49<span> / month</span></p>
      <ul>
        <li>Unlimited listings</li>
        <li>Dynamic nightly rates</li>
        <li>Email support on weekdays</li>
      </ul>
    </article>
    <section>
      <h2>Who uses Pro</h2>
      <p data-segment="smb" data-customers="300" data-monthly-churn="0.04">
        Small hosts running a handful of listings.
      </p>
      <p data-segment="mid" data-customers="120" data-monthly-churn="0.02">
        Growing portfolios with a mid-size team.
      </p>
    </section>
  </main>
</body>
</html>
